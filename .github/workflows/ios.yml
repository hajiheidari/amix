name: iOS
# Runs on a GitHub-hosted Mac (no local Mac needed). Manual only: Actions → iOS → Run workflow.
#  - upload = false: compiles for the iOS Simulator without signing (verifies the build).
#  - upload = true : archives, signs with Apple cloud-managed signing and uploads to
#                    App Store Connect / TestFlight. Needs repository secrets:
#                    APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (full .p8 text).
# Note: macOS minutes on private repositories count 10x against the GitHub Actions quota.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload to TestFlight
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - run: xcodebuild -version
      - name: Compile for simulator (unsigned)
        if: ${{ !inputs.upload }}
        run: |
          xcodebuild -project apps/client/ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit ${PIPESTATUS[0]}
      - name: Archive, sign and upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v (see docs/github-builds-fa.md)"; exit 1; fi
          done
          KEY="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          # Normalize the pasted key (Windows CRLF, BOM, spaces, missing header lines, or a
          # base64-encoded copy of the whole file) into a clean PEM. Never printed.
          RAW=$(printf '%s' "${ASC_KEY_P8}" | tr -d '\r' | sed $'s/^\xEF\xBB\xBF//')
          if ! grep -q "BEGIN PRIVATE KEY" <<<"$RAW"; then
            DEC=$(printf '%s' "$RAW" | tr -d ' \n\t' | base64 -D 2>/dev/null || true)
            if grep -q "BEGIN PRIVATE KEY" <<<"$DEC"; then RAW="$DEC"; fi
          fi
          BODY=$(printf '%s' "$RAW" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -dc 'A-Za-z0-9+/=')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            rm -f "$KEY"
            echo "::error::ASC_KEY_P8 is not a valid App Store Connect .p8 key (body length ${#BODY}). Paste the full text of AuthKey_XXXX.p8 again."
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project apps/client/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "${RUNNER_TEMP}/Amix.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}" archive | tail -n 40
          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "${RUNNER_TEMP}/Amix.xcarchive" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" -exportPath "${RUNNER_TEMP}/export" "${AUTH[@]}"
          rm -f "$KEY"
          echo "Uploaded version $VERSION build $BUILD_NUMBER to App Store Connect."
